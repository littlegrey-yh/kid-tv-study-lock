plugins {
    id 'com.android.application'
}

android {
    namespace 'com.family.gate'
    compileSdk 34

    defaultConfig {
        applicationId "com.family.gate"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "0.5.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
