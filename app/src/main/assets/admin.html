<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习门禁 · 管理页</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 860px; margin: 0 auto; padding: 16px; color: #222; }
  h1 { font-size: 22px; } h2 { font-size: 17px; margin-top: 28px; border-left: 4px solid #0F6E56; padding-left: 8px; }
  label { display: block; margin-top: 10px; font-size: 14px; color: #444; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 8px 16px; margin-top: 10px; margin-right: 8px; font-size: 14px; border: 0; border-radius: 6px; background: #0F6E56; color: #fff; cursor: pointer; }
  button.gray { background: #888; } button.red { background: #A32D2D; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  td, th { border-bottom: 1px solid #eee; padding: 6px 4px; text-align: left; vertical-align: top; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  .msg { margin-top: 8px; font-size: 13px; color: #0F6E56; min-height: 18px; }
  .tag { font-size: 12px; color: #888; }
</style>
</head>
<body>

<h1>学习门禁 · 管理页</h1>
<p class="tag">与电视同一 Wi-Fi 下访问。所有数据只保存在电视本地。</p>
<div id="status" class="msg"></div>

<h2>远程解锁</h2>
<label>家长方向密码（U=上 D=下 L=左 R=右，默认 UDUDLRLR）</label>
<input id="unlockSeq" placeholder="UDUDLRLR">
<div>
  <button onclick="unlock(30)">放行30分钟</button>
  <button onclick="unlock(60)">放行1小时</button>
  <button onclick="unlock(120)">放行2小时</button>
</div>
<div id="unlockMsg" class="msg"></div>

<h2>设置</h2>
<div class="row">
  <div><label>门禁总开关</label><select id="gateEnabled"><option value="true">开启</option><option value="false">关闭</option></select></div>
  <div><label>开机答题数（答对几题放行）</label><select id="bootQuestions"><option>3</option><option>5</option><option>10</option></select></div>
  <div><label>弹题间隔（分钟）</label><select id="quizIntervalMin"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
</div>
<label>孩子当前年级（抽题范围 = 该年级及以前所有学年，如选"三年级上"则考一上~三上全部题目）</label>
<select id="kidGradeTerm">
  <option value="1-1">一年级上</option><option value="1-2">一年级下</option>
  <option value="2-1">二年级上</option><option value="2-2">二年级下</option>
  <option value="3-1">三年级上</option><option value="3-2">三年级下</option>
  <option value="4-1">四年级上</option><option value="4-2">四年级下</option>
  <option value="5-1">五年级上</option><option value="5-2">五年级下</option>
  <option value="6-1">六年级上</option><option value="6-2">六年级下</option>
</select>
<label>观看监控（每满弹题间隔弹出答题，v0.8 完整支持）</label>
<select id="watchMonitorEnabled"><option value="true">开启</option><option value="false" selected>关闭</option></select>
<label>家长方向密码（4-12位，U/D/L/R 组合，改完遥控器输入也随之变化）</label>
<input id="parentSeq" placeholder="UDUDLRLR">
<label>视频类应用包名（逗号分隔，命中即计时弹题）</label>
<textarea id="videoApps" rows="3"></textarea>
<button onclick="saveConfig()">保存设置</button>
<div id="cfgMsg" class="msg"></div>

<h2>添加题目</h2>
<div class="row">
  <div><label>科目</label><input id="subject" placeholder="语文/数学/英语..."></div>
  <div><label>所属年级学期</label><select id="qGradeTerm"></select></div>
  <div><label>难度</label><select id="difficulty"><option value="1">易（送分/基础）</option><option value="2" selected>中（课后练习水平）</option><option value="3">难（拓展）</option></select></div>
  <div><label>答案</label><select id="answer"><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
</div>
<label>题干</label><textarea id="stem" rows="2"></textarea>
<div class="row">
  <div><label>选项A</label><input id="optA"></div>
  <div><label>选项B</label><input id="optB"></div>
</div>
<div class="row">
  <div><label>选项C（可空）</label><input id="optC"></div>
  <div><label>选项D（可空）</label><input id="optD"></div>
</div>
<label>解析（可选）</label><input id="explanation">
<button onclick="addQuestion()">添加题目</button>
<div id="addMsg" class="msg"></div>

<h2>批量导入 / 导出</h2>
<label>粘贴 JSON 数组（字段同单题）后点导入</label>
<textarea id="importBox" rows="4" placeholder='[{"subject":"数学","stem":"3+5=?","optA":"6","optB":"7","optC":"8","optD":"9","answer":"C"}]'></textarea>
<button onclick="importJson()">导入</button>
<button class="gray" onclick="exportJson()">导出全部题目</button>
<div id="ioMsg" class="msg"></div>

<h2>薄弱分析（近 14 天，按科目）</h2>
<canvas id="chart" width="840" height="300" style="width:100%; border:1px solid #eee; border-radius:8px; background:#fff;"></canvas>
<div id="chartLegend" class="tag" style="margin-top:6px;"></div>
<h3 style="font-size:15px; margin-top:20px;">错得最多的题（Top 10）</h3>
<table id="wtable"><thead><tr><th>科目</th><th>题干</th><th>答题次数</th><th>错误次数</th><th>正确率</th></tr></thead><tbody></tbody></table>
<div id="weakEmpty" class="msg"></div>

<h2>题库（<span id="count">0</span> 题）</h2>
<table id="qtable"><thead><tr><th>科目</th><th>年级</th><th>题干</th><th>答案</th><th>启用</th><th></th></tr></thead><tbody></tbody></table>

<script>
const $ = id => document.getElementById(id);

async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return r.json();
}

async function refreshStatus() {
  try {
    const s = await api('/api/status');
    $('status').textContent = `门禁：${s.gateEnabled ? '已开启' : '未开启'} · 题库 ${s.count} 题 · 版本 v${s.version}`;
    $('count').textContent = s.count;
  } catch(e) { $('status').textContent = '无法连接电视，请确认手机与电视在同一 Wi-Fi。'; }
}

const GRADE_NAMES = {"1-1":"一上","1-2":"一下","2-1":"二上","2-2":"二下","3-1":"三上","3-2":"三下","4-1":"四上","4-2":"四下","5-1":"五上","5-2":"五下","6-1":"六上","6-2":"六下"};

function fillGradeTermSelect(sel, defKey) {
  sel.innerHTML = "";
  for (const k in GRADE_NAMES) {
    const o = document.createElement("option");
    o.value = k; o.textContent = GRADE_NAMES[k];
    sel.appendChild(o);
  }
  if (defKey) sel.value = defKey;
}

async function loadConfig() {
  const c = await api('/api/config');
  $('gateEnabled').value = String(c.gateEnabled);
  $('bootQuestions').value = String(c.bootQuestions);
  $('quizIntervalMin').value = String(c.quizIntervalMin);
  $('watchMonitorEnabled').value = String(c.watchMonitorEnabled);
  $('parentSeq').value = c.parentSeq;
  $('videoApps').value = c.videoApps;
  fillGradeTermSelect($('kidGradeTerm'), c.kidGrade + '-' + c.kidTerm);
  fillGradeTermSelect($('qGradeTerm'), c.kidGrade + '-' + c.kidTerm);
}

async function saveConfig() {
  const gt = $('kidGradeTerm').value.split('-');
  const r = await api('/api/config', {
    gateEnabled: $('gateEnabled').value === 'true',
    bootQuestions: parseInt($('bootQuestions').value),
    quizIntervalMin: parseInt($('quizIntervalMin').value),
    watchMonitorEnabled: $('watchMonitorEnabled').value === 'true',
    parentSeq: $('parentSeq').value.trim(),
    kidGrade: parseInt(gt[0]),
    kidTerm: parseInt(gt[1]),
    videoApps: $('videoApps').value.trim()
  });
  $('cfgMsg').textContent = r.ok ? '已保存。' : ('保存失败：' + r.error);
  refreshStatus();
}

async function addQuestion() {
  if (!$('stem').value.trim()) { $('addMsg').textContent = '题干不能为空'; return; }
  const gt = $('qGradeTerm').value.split('-');
  const r = await api('/api/questions', {
    subject: $('subject').value.trim() || '通用',
    difficulty: parseInt($('difficulty').value),
    grade: parseInt(gt[0]),
    term: parseInt(gt[1]),
    stem: $('stem').value.trim(),
    optA: $('optA').value.trim(), optB: $('optB').value.trim(),
    optC: $('optC').value.trim() || null, optD: $('optD').value.trim() || null,
    answer: $('answer').value,
    explanation: $('explanation').value.trim(), enabled: true
  });
  $('addMsg').textContent = r.ok ? `已添加（id=${r.id}）` : '添加失败';
  ['stem','optA','optB','optC','optD','explanation'].forEach(i => $(i).value = '');
  loadQuestions(); refreshStatus();
}

async function loadQuestions() {
  const data = await api('/api/questions');
  const tb = document.querySelector('#qtable tbody');
  tb.innerHTML = '';
  (data.questions || []).forEach(q => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${q.subject}</td><td>${GRADE_NAMES[q.grade + '-' + q.term] || (q.grade + '上')}</td><td>${q.stem}</td><td>${q.answer}</td>
      <td><button class="gray" onclick="toggle(${q.id},${!q.enabled})">${q.enabled ? '停用' : '启用'}</button></td>
      <td><button class="red" onclick="del(${q.id})">删除</button></td>`;
    tb.appendChild(tr);
  });
}

async function del(id)        { await api('/api/questions/delete', {id}); loadQuestions(); refreshStatus(); }
async function toggle(id, en) { await api('/api/questions/enable', {id, enabled: en}); loadQuestions(); }

async function importJson() {
  const r = await api('/api/import', {json: $('importBox').value});
  $('ioMsg').textContent = r.ok ? `导入 ${r.imported} 题` : ('导入失败：' + r.error);
  loadQuestions(); refreshStatus();
}

async function exportJson() {
  const data = await api('/api/export');
  $('importBox').value = JSON.stringify(data, null, 2);
  $('ioMsg').textContent = '已导出到下方文本框，可复制保存。';
}

async function unlock(minutes) {
  const r = await api('/api/unlock', {seq: $('unlockSeq').value.trim(), minutes});
  $('unlockMsg').textContent = r.ok ? `电视已放行 ${minutes} 分钟。` : (r.error || '解锁失败');
}

// ---- 薄弱分析（按科目正确率折线图 + 薄弱题清单） ----
const SUBJECT_COLORS = {"语文":"#C0392B","数学":"#1F6FB2","英语":"#8E6FB8"};
const colorOf = s => SUBJECT_COLORS[s] || "#55883B";

async function loadStats() {
  let st;
  try { st = await api('/api/stats'); } catch(e) { return; }
  const rows = st.rows || [];
  const days = [...new Set(rows.map(r => r.day))].sort();
  const subjects = [...new Set(rows.map(r => r.subject))];
  const byS = {};
  subjects.forEach(s => byS[s] = {});
  rows.forEach(r => {
    const m = byS[r.subject][r.day] || (byS[r.subject][r.day] = {ok: 0, total: 0});
    m.ok += r.ok; m.total += r.total;
  });
  drawChart(days, subjects, byS);
  $('chartLegend').textContent = '纵轴为当日正确率（答对/答题次数），线越低说明该科目越薄弱；某天没答到该科目则无数据点。';
  const tb = document.querySelector('#wtable tbody');
  tb.innerHTML = '';
  (st.weak || []).forEach(w => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${w.subject}</td><td>${w.stem}</td><td>${w.total}</td><td>${w.total - w.ok}</td><td>${Math.round(100 * w.ok / w.total)}%</td>`;
    tb.appendChild(tr);
  });
  $('weakEmpty').textContent = rows.length ? '' : '还没有答题记录，孩子在电视上答题后这里会自动生成折线图和薄弱题清单。';
}

function drawChart(days, subjects, byS) {
  const cv = $('chart'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const padL = 42, padR = 14, padT = 34, padB = 40;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  ctx.font = '12px "PingFang SC", sans-serif';
  // 网格与纵轴
  ctx.lineWidth = 1;
  for (let v = 0; v <= 100; v += 25) {
    const y = padT + plotH * (1 - v / 100);
    ctx.strokeStyle = '#eee';
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    ctx.fillStyle = '#888'; ctx.textAlign = 'right';
    ctx.fillText(v + '%', padL - 6, y + 4);
  }
  // 横轴日期（点多时隔天显示）
  const step = Math.max(1, Math.ceil(days.length / 8));
  ctx.textAlign = 'center'; ctx.fillStyle = '#888';
  days.forEach((d, i) => {
    if (i % step) return;
    const x = padL + plotW * (days.length === 1 ? 0.5 : i / (days.length - 1));
    ctx.fillText(d.slice(5), x, H - padB + 16);
  });
  // 各科目折线（只连接有数据的日子）
  subjects.forEach(s => {
    const pts = [];
    days.forEach((d, i) => {
      const m = byS[s][d];
      if (m) pts.push({
        x: padL + plotW * (days.length === 1 ? 0.5 : i / (days.length - 1)),
        y: padT + plotH * (1 - m.ok / m.total)
      });
    });
    if (!pts.length) return;
    ctx.strokeStyle = colorOf(s); ctx.fillStyle = colorOf(s); ctx.lineWidth = 2;
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();
    pts.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, 7); ctx.fill(); });
  });
  // 图例
  let lx = padL;
  ctx.textAlign = 'left';
  subjects.forEach(s => {
    ctx.fillStyle = colorOf(s);
    ctx.fillRect(lx, 10, 12, 12);
    ctx.fillStyle = '#444';
    ctx.fillText(s, lx + 16, 20);
    lx += 16 + ctx.measureText(s).width + 18;
  });
}

refreshStatus(); loadConfig(); loadQuestions(); loadStats();
</script>
</body>
</html>
